{{- if .Values.configMap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "petclinic-service.name" . }}-config
  namespace: {{ include "petclinic-service.namespace" . }}
  labels:
    {{- include "petclinic-service.labels" . | nindent 4 }}
data:
  {{- toYaml .Values.configMap.data | nindent 2 }}
{{- end }}
