apiVersion: v1
kind: Service
metadata:
  name: {{ include "petclinic-service.name" . }}
  namespace: {{ include "petclinic-service.namespace" . }}
  labels:
    {{- include "petclinic-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "petclinic-service.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
