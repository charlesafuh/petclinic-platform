# ClusterSecretStore for AWS Secrets Manager (PETPLAT-34).
#
# Cluster-scoped so a single store serves ExternalSecrets in any namespace
# (petclinic-dev / petclinic-prod). ESO authenticates to AWS via the
# external-secrets-sa ServiceAccount (IRSA → petclinic-{env}-eso-role), which
# holds read-only access scoped to petclinic/{env}/* in Secrets Manager.
#
# region is eu-central-1 in both environments (same region as all infrastructure).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: infrastructure
spec:
  # Least privilege: although the store is cluster-scoped, restrict which
  # namespaces may reference it to the application namespaces only. Without this,
  # any namespace could create an ExternalSecret pulling petclinic/{env}/* secrets
  # (including rds-credentials) through the ESO role. Both env namespaces are
  # listed so the same manifest is valid on either cluster.
  conditions:
    - namespaces:
        - petclinic-dev
        - petclinic-prod
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
