# ExternalSecret: RDS credentials (PETPLAT-35).
#
# Syncs the RDS master credentials from the single JSON secret
# petclinic/{env}/rds-credentials in AWS Secrets Manager into a Kubernetes
# Secret named `rds-credentials`. The JSON secret has `username` and `password`
# keys (created by the rds module, PETPLAT-23); remoteRef.property extracts each.
# The domain services (customers/visits/vets) mount these as env vars.
#
# Per-environment values (namespace, remoteRef.key) are patched by the Kustomize
# overlay / ArgoCD. Base defaults target dev: namespace petclinic-dev and
# secret key petclinic/dev/rds-credentials. For prod these become petclinic-prod
# and petclinic/prod/rds-credentials.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rds-credentials
  namespace: petclinic-dev
  labels:
    app.kubernetes.io/name: rds-credentials
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: infrastructure
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: rds-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: petclinic/dev/rds-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: petclinic/dev/rds-credentials
        property: password
