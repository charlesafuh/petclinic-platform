# ServiceAccount for the External Secrets Operator (PETPLAT-34 / PETPLAT-37).
#
# This is the identity the ClusterSecretStore assumes (auth.jwt.serviceAccountRef)
# to reach AWS Secrets Manager. The eks.amazonaws.com/role-arn annotation binds
# it to the ESO IRSA role (petclinic-{env}-eso-role) created in the eks module;
# the pod then receives temporary AWS credentials via the OIDC web-identity flow —
# no static keys. IMDSv2 hop limit 1 on the nodes forces this IRSA path.
#
# The role ARN is environment-specific. The placeholder below is set per env from
# the Terraform output `eso_role_arn` (patched by the Kustomize overlay / ArgoCD).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: external-secrets
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: infrastructure
  annotations:
    eks.amazonaws.com/role-arn: REPLACE_WITH_ESO_ROLE_ARN
