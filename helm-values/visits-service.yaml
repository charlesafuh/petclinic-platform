# visits-service — visit records. MySQL-backed.
component: backend

image:
  name: visits-service
  tag: "305a1f1"   # CI (update-image-tags.yml) overwrites with the commit SHA

service:
  port: 8082
  targetPort: 8082

springProfiles: "docker,mysql"

env:
  - name: CONFIG_SERVER_URL
    value: "http://config-server:8888"

secrets:
  - name: SPRING_DATASOURCE_USERNAME
    secretName: rds-credentials
    key: username
  - name: SPRING_DATASOURCE_PASSWORD
    secretName: rds-credentials
    key: password

database:
  enabled: true
  name: petclinic

initContainers:
  - name: config-server
    port: 8888
  - name: discovery-server
    port: 8761

# Prod shape (dev.yaml forces replicas=1 and disables HPA/PDB).
replicaCount: 2
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
podDisruptionBudget:
  enabled: true
  minAvailable: 1
