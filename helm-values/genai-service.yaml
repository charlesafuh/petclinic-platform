# genai-service — OpenAI-backed chat (Spring AI). OPENAI_API_KEY from Secrets Manager via ESO.
component: backend

image:
  name: genai-service
  tag: "305a1f1"   # CI (update-image-tags.yml) overwrites with the commit SHA

service:
  port: 8084
  targetPort: 8084

springProfiles: "docker"

env:
  - name: CONFIG_SERVER_URL
    value: "http://config-server:8888"

secrets:
  - name: OPENAI_API_KEY
    secretName: openai-api-key
    key: OPENAI_API_KEY

initContainers:
  - name: config-server
    port: 8888
  - name: discovery-server
    port: 8761

# Prod shape: single replica baseline, HPA 1-3, no PDB (dev.yaml disables HPA).
replicaCount: 1
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
