# discovery-server — Eureka. Depends on config-server.
component: infrastructure

image:
  name: discovery-server
  tag: "0000000"   # CI (update-image-tags.yml) overwrites with the commit SHA

service:
  port: 8761
  targetPort: 8761

springProfiles: "docker"

env:
  - name: CONFIG_SERVER_URL
    value: "http://config-server:8888"

secrets: []

initContainers:
  - name: config-server
    port: 8888

# Prod shape (dev.yaml forces replicas=1 and disables PDB).
replicaCount: 2
podDisruptionBudget:
  enabled: true
  minAvailable: 1
